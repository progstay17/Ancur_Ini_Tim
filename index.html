<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AIT — The Data Core</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,95 5,95' fill='%23991d20'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#020202;--bg2:#080808;--bg3:#0d0d0d;
  --red:#991d20;--red2:#c0392b;--red3:rgba(153,29,32,.15);
  --white:#f0f0f0;--gray:#555;--gray2:#2e2e2e;
  --mono:'Share Tech Mono',monospace;
  --display:'Bebas Neue',sans-serif;
  --body:'Inter',sans-serif;
  --t:0.4s cubic-bezier(.25,.46,.45,.94);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--white);font-family:var(--body);overflow-x:hidden;cursor:none;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--red);}

/* CURSOR */
#cur,#cur2{position:fixed;pointer-events:none;z-index:9999;top:0;left:0;}
#cur{width:10px;height:10px;}
#cur svg{width:100%;height:100%;}
#cur2{width:32px;height:32px;border:1px solid var(--red);border-radius:50%;opacity:.4;transition:transform .25s ease;}
@media(hover:none){#cur,#cur2{display:none;}body{cursor:auto;}}

/* PROGRESS */
#prog{position:fixed;top:0;left:0;height:2px;background:var(--red2);z-index:600;width:0;box-shadow:0 0 8px var(--red2);}

/* AUDIO BTN */
#abtn{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:400;
  width:44px;height:44px;border-radius:50%;
  background:rgba(8,8,8,.9);border:1px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity 1s ease,background var(--t);
}
#abtn.show{opacity:1;}
#abtn:hover{background:var(--red3);}
#abtn svg{width:18px;height:18px;}

/* ═══ BOOT ═══ */
#boot{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}
#boot.done{opacity:0;visibility:hidden;pointer-events:none;}
.blogo{width:clamp(180px,38vw,340px);margin-bottom:3rem;opacity:0;animation:fadeUp .8s ease .3s forwards;}
.blines{width:100%;max-width:540px;font-family:var(--mono);font-size:clamp(.55rem,.85vw,.72rem);color:#383838;line-height:2.1;}
.bl{display:block;opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .25s,color .3s;}
.bl.s{opacity:1;transform:none;}
.bl.ok{color:#2d6a2d;}
.bl.rd{color:var(--red2);}
.bl.wh{color:var(--white);}
.bbarw{width:100%;max-width:540px;margin-top:1.5rem;height:2px;background:var(--gray2);border-radius:2px;opacity:0;animation:fadeUp .5s ease 1s forwards;}
.bbar{height:100%;background:var(--red2);width:0;border-radius:2px;box-shadow:0 0 8px var(--red2);}
.bpct{font-family:var(--mono);font-size:.62rem;color:var(--gray);text-align:right;margin-top:.4rem;opacity:0;animation:fadeUp .5s ease 1s forwards;}
.bclick{margin-top:2rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);opacity:0;cursor:pointer;animation:blinkT 1s step-end infinite;}
.bclick.s{opacity:1;}
@keyframes blinkT{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes fadeUp{to{opacity:1;transform:none;}}

/* ═══ NAV ═══ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 3rem;
  background:rgba(2,2,2,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(153,29,32,.12);
  transform:translateY(-100%);transition:transform .8s ease;
}
nav.show{transform:none;}
.nlogo{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;color:var(--gray);display:flex;align-items:center;gap:.7rem;}
.nlogo span{color:var(--red2);}
.nid{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;color:var(--gray);padding:.18rem .5rem;border:1px solid var(--gray2);border-radius:2px;}
.nlinks{display:flex;gap:2rem;list-style:none;}
.nlinks a{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);transition:color var(--t);position:relative;}
.nlinks a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--red2);transition:width var(--t);}
.nlinks a:hover{color:var(--white);}
.nlinks a:hover::after{width:100%;}
.ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.ham span{display:block;width:22px;height:1.5px;background:var(--white);transition:var(--t);}
.ham.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.ham.open span:nth-child(2){opacity:0;}
.ham.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.mnav{display:none;position:fixed;inset:0;background:rgba(2,2,2,.98);z-index:199;flex-direction:column;align-items:center;justify-content:center;gap:3rem;}
.mnav.open{display:flex;}
.mnav a{font-family:var(--display);font-size:3rem;letter-spacing:.1em;color:var(--gray);transition:color var(--t);}
.mnav a:hover{color:var(--red2);}

/* ═══ SECTIONS ═══ */
section{position:relative;z-index:2;padding:7rem 2rem;}
.inner{max-width:1100px;margin:0 auto;}
.slbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--red2);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;}
.slbl::before{content:'//';color:var(--gray2);}
.stitle{font-family:var(--display);font-size:clamp(2.8rem,7vw,6rem);letter-spacing:.04em;line-height:.95;margin-bottom:2.5rem;}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;}
.reveal.v{opacity:1;transform:none;}

/* ═══ HERO ═══ */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 2rem 4rem;overflow:hidden;}
#hcanvas{position:absolute;inset:0;z-index:0;}
.hi{position:relative;z-index:2;}
.hstatus{font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);margin-bottom:2.5rem;display:flex;align-items:center;justify-content:center;gap:.5rem;opacity:0;animation:fadeUp .6s ease .3s forwards;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--red2);animation:blinkD 1.2s step-end infinite;}
@keyframes blinkD{0%,100%{opacity:1;}50%{opacity:0;}}
.hlogow{width:clamp(220px,44vw,480px);margin:0 auto 3rem;cursor:pointer;filter:drop-shadow(0 0 40px rgba(153,29,32,.4));transition:filter var(--t);opacity:0;animation:fadeUp .8s ease .5s forwards;transform-style:preserve-3d;}
.hlogow:hover{filter:drop-shadow(0 0 80px rgba(192,57,43,.8));}
.hlogow.shake{animation:logoShake .5s ease;}
@keyframes logoShake{0%,100%{transform:perspective(600px) rotateX(0) rotateY(0) scale(1);}20%{transform:perspective(600px) rotateX(-4deg) rotateY(-4deg) scale(1.05);}40%{transform:perspective(600px) rotateX(4deg) rotateY(4deg) scale(1.08);}60%{transform:perspective(600px) rotateX(-2deg) rotateY(-2deg) scale(1.04);}80%{transform:perspective(600px) rotateX(1deg) rotateY(1deg);}}
.htitle{font-family:var(--display);font-size:clamp(1.8rem,5vw,4rem);letter-spacing:.06em;line-height:1;margin-bottom:1rem;opacity:0;animation:fadeUp .8s ease .7s forwards;}
.htitle em{color:var(--red2);font-style:normal;}
.hsub{font-family:var(--mono);font-size:clamp(.6rem,1.4vw,.75rem);letter-spacing:.14em;text-transform:uppercase;color:var(--gray);max-width:580px;margin:0 auto 3rem;line-height:1.9;opacity:0;animation:fadeUp .8s ease .9s forwards;}
.hchips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:3rem;opacity:0;animation:fadeUp .8s ease 1.1s forwards;}
.chip{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.28rem .7rem;border:1px solid var(--gray2);border-radius:2px;color:var(--gray);transition:border-color var(--t),color var(--t),background var(--t);cursor:default;}
.chip:hover{border-color:var(--red2);color:var(--white);background:var(--red3);}
.hscroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:0;animation:fadeUp .8s ease 1.5s forwards;}
.hscroll span{font-family:var(--mono);font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gray2);}
.sline{width:1px;height:40px;background:linear-gradient(to bottom,var(--red2),transparent);animation:sp 2s ease-in-out infinite;}
@keyframes sp{0%,100%{transform:scaleY(1);opacity:1;}50%{transform:scaleY(.5);opacity:.3;}}

/* ═══ TICKER ═══ */
#ticker{position:relative;z-index:2;background:var(--bg2);border-top:1px solid rgba(153,29,32,.18);border-bottom:1px solid rgba(153,29,32,.18);overflow:hidden;padding:.55rem 0;}
.tkin{display:flex;gap:3rem;animation:tscroll 32s linear infinite;white-space:nowrap;}
.tkitem{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);display:flex;align-items:center;gap:.45rem;flex-shrink:0;}
.tkitem span{color:var(--red2);}
@keyframes tscroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* ═══ STATS ═══ */
#stats{background:var(--bg);padding:4rem 2rem;}
.sgrid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;text-align:center;}
.snum{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.8rem);color:var(--red2);line-height:1;}
.slbl2{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin-top:.5rem;}
.ssub{font-size:.52rem;color:#333;margin-top:.2rem;font-family:var(--mono);}

/* ═══ ABOUT ═══ */
#about{background:var(--bg2);}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start;margin-top:3rem;}
.atxt p{color:var(--gray);line-height:1.9;font-size:.88rem;margin-bottom:1.1rem;}
.atxt p em{color:var(--white);font-style:normal;font-weight:500;}
.atxt p strong{color:var(--red2);font-weight:600;}
.cbox{background:var(--bg3);border:1px solid rgba(153,29,32,.28);border-left:3px solid var(--red);border-radius:3px;padding:1.4rem;margin-bottom:1.8rem;position:relative;overflow:hidden;}
.cbox::before{content:'CLASSIFIED';position:absolute;top:.35rem;right:.6rem;font-family:var(--mono);font-size:.48rem;letter-spacing:.18em;color:rgba(153,29,32,.25);}
.cbox p{font-family:var(--mono);font-size:.68rem;color:var(--gray);line-height:1.9;}
.cbox p em{color:var(--red2);font-style:normal;}
.disc{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.09em;color:var(--gray2);margin-top:.8rem;padding:.35rem .7rem;border:1px solid var(--gray2);border-radius:2px;}
.terms{display:flex;flex-direction:column;gap:1.1rem;}
.tcard{background:var(--bg3);border:1px solid var(--gray2);border-radius:3px;overflow:hidden;transition:border-color var(--t);}
.tcard:hover{border-color:var(--red);}
.tbar{background:var(--bg2);padding:.38rem .8rem;display:flex;align-items:center;gap:.35rem;border-bottom:1px solid var(--gray2);}
.td{width:7px;height:7px;border-radius:50%;}
.td:nth-child(1){background:#2a2a2a;}
.td:nth-child(2){background:#2a2a2a;}
.td:nth-child(3){background:var(--red);}
.ttitle{font-family:var(--mono);font-size:.52rem;letter-spacing:.09em;color:var(--gray);margin-left:.3rem;}
.tbody{padding:.9rem 1.1rem;}
.tbody p{font-family:var(--mono);font-size:.68rem;color:var(--gray);line-height:1.75;}
.tbody p em{color:var(--white);font-style:normal;}
.tbody .cmd{color:var(--red2);}

/* ═══ TOOLS ═══ */
#tools{background:var(--bg);}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.4rem;margin-top:3rem;}
.toolcard{background:var(--bg3);border:1px solid var(--gray2);border-radius:3px;padding:1.8rem;cursor:pointer;overflow:hidden;position:relative;transition:border-color var(--t),transform var(--t),box-shadow var(--t);transform-style:preserve-3d;}
.toolcard::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(153,29,32,.07),transparent);opacity:0;transition:opacity var(--t);}
.toolcard:hover{border-color:var(--red2);transform:translateY(-6px) perspective(600px) rotateX(2deg);box-shadow:0 20px 60px rgba(153,29,32,.18);}
.toolcard:hover::after{opacity:1;}
.thead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.4rem;}
.tid{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--red2);display:flex;align-items:center;gap:.35rem;}
.tid::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red2);animation:blinkD 1.5s step-end infinite;}
.tstat{font-family:var(--mono);font-size:.48rem;letter-spacing:.09em;color:#2d6a2d;padding:.18rem .45rem;border:1px solid #2d6a2d;border-radius:2px;}
.tname{font-family:var(--display);font-size:1.9rem;letter-spacing:.05em;margin-bottom:.5rem;line-height:1;}
.tdesc{font-size:.8rem;color:var(--gray);line-height:1.7;margin-bottom:1.4rem;}
.ttags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1.6rem;}
.ttag{font-family:var(--mono);font-size:.52rem;letter-spacing:.07em;padding:.18rem .45rem;background:rgba(153,29,32,.07);border:1px solid rgba(153,29,32,.22);border-radius:2px;color:var(--gray);}
.tcta{display:flex;align-items:center;gap:.55rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--white);transition:gap var(--t);}
.toolcard:hover .tcta{gap:.9rem;}
.carr{width:26px;height:26px;border:1px solid var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background var(--t),border-color var(--t);}
.toolcard:hover .carr{background:var(--red2);border-color:var(--red2);}
.tprog{position:absolute;bottom:0;left:0;height:2px;background:var(--red2);width:0;}
.toolcard.launching .tprog{transition:width .6s ease;width:100%;}

/* ═══ TEAM ═══ */
#team{background:var(--bg2);}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:1.1rem;margin-top:3rem;}
.mcard{perspective:900px;cursor:pointer;}
.minner{position:relative;width:100%;padding-top:145%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.34,1.56,.64,1);}
.mcard:hover .minner,.mcard.flip .minner{transform:rotateY(180deg);}
.mfront,.mback{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.1rem;text-align:center;border:1px solid var(--gray2);background:var(--bg3);}
.mback{transform:rotateY(180deg);background:rgba(153,29,32,.05);border-color:var(--red);}
.mbadge{font-family:var(--mono);font-size:.48rem;letter-spacing:.1em;color:var(--gray2);margin-bottom:.7rem;padding:.13rem .38rem;border:1px solid var(--gray2);border-radius:2px;}
.mavatar{width:52px;height:52px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.3rem;color:var(--red2);margin-bottom:.7rem;box-shadow:0 0 18px rgba(153,29,32,.22);}
.mavatar.f{border-color:#a06880;color:#a06880;box-shadow:0 0 18px rgba(160,104,128,.22);}
.mname{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em;margin-bottom:.18rem;}
.mpos{font-family:var(--mono);font-size:.52rem;letter-spacing:.07em;text-transform:uppercase;color:var(--gray);}
.mrole{font-family:var(--display);font-size:.95rem;color:var(--red2);letter-spacing:.04em;margin-bottom:.5rem;line-height:1.2;}
.mbio{font-size:.68rem;color:var(--gray);line-height:1.5;}
.thint{text-align:center;margin-top:1rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gray2);}

/* ═══ REVELATION ═══ */
#rev{background:var(--bg);min-height:80vh;display:flex;align-items:center;text-align:center;overflow:hidden;}
#rcanvas{position:absolute;inset:0;z-index:0;}
.rinner{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:0 2rem;}
.rpre{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--red2);margin-bottom:2rem;}
.rtitle{font-family:var(--display);font-size:clamp(3rem,8vw,7rem);letter-spacing:.04em;line-height:.95;margin-bottom:2rem;}
.rtitle em{color:var(--red2);font-style:normal;}
.rbody{font-size:clamp(.82rem,2vw,1rem);color:var(--gray);line-height:1.95;max-width:640px;margin:0 auto 2.5rem;}
.rbody em{color:var(--white);font-style:normal;font-weight:500;}
.rbody strong{color:var(--red2);}
.rclaim{font-family:var(--mono);font-size:clamp(.65rem,1.4vw,.82rem);letter-spacing:.14em;text-transform:uppercase;color:var(--white);padding:.9rem 2rem;border:1px solid var(--red);border-radius:3px;display:inline-block;margin-bottom:2.5rem;animation:cpulse 3s ease-in-out infinite;}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 0 rgba(153,29,32,.4);}50%{box-shadow:0 0 0 12px rgba(153,29,32,0);}}
.rtagline{font-family:var(--display);font-size:clamp(1.4rem,3.5vw,2.8rem);letter-spacing:.06em;color:var(--gray);}
.rtagline em{color:var(--white);font-style:normal;}

/* ═══ FOOTER ═══ */
footer{position:relative;z-index:2;background:var(--bg2);border-top:1px solid rgba(153,29,32,.12);padding:3rem 2rem;text-align:center;}
.flogo{width:clamp(110px,18vw,190px);margin:0 auto 1rem;opacity:.55;}
.fname{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);margin-bottom:2rem;}
.fdiv{width:36px;height:1px;background:var(--red);margin:0 auto 2rem;}
.fbuilt{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;color:var(--gray2);}
.fbuilt em{color:var(--red2);font-style:normal;}
.fdisc{margin-top:.7rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;color:var(--gray2);}
.fdisc span{color:var(--gray);}
.feaster{margin-top:1.5rem;font-family:var(--mono);font-size:.48rem;letter-spacing:.07em;color:#141414;cursor:default;transition:color .4s;}
.feaster:hover{color:var(--red2);}

/* ═══ RESPONSIVE ═══ */
@media(max-width:768px){
  nav{padding:1rem 1.4rem;}
  .nlinks{display:none;}
  .ham{display:flex;}
  .agrid{grid-template-columns:1fr;gap:2.2rem;}
  .sgrid{grid-template-columns:repeat(2,1fr);}
  .teamgrid{grid-template-columns:repeat(2,1fr);}
  section{padding:5rem 1.4rem;}
  #stats{padding:3rem 1.4rem;}
}
@media(max-width:480px){
  .tgrid{grid-template-columns:1fr;}
  .teamgrid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div id="cur"><svg viewBox="0 0 10 10"><polygon points="5,0 10,10 0,10" fill="#991d20"/></svg></div>
<div id="cur2"></div>
<div id="prog"></div>

<div id="abtn" title="Toggle Audio">
  <svg id="aicon" viewBox="0 0 24 24" fill="none" stroke="#991d20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</div>

<!-- BOOT -->
<div id="boot">
  <svg class="blogo" viewBox="0 0 724.02 147.65" xmlns="http://www.w3.org/2000/svg">
    <polygon points="232.41 0 115.02 146.61 194.32 146.61 263.19 55.04 325.8 147.65 398.84 147.65 304.41 0 232.41 0" fill="white"/>
    <polygon points="218.84 147.65 252.5 98.87 270.5 98.87 300.23 147.65 218.84 147.65" fill="#991d20"/>
    <polygon points="378.5 0 439.54 0 439.54 147.65 413.15 147.65 378.5 95.61 378.5 0" fill="white"/>
